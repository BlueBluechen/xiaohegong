<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#F5F1E7;overflow:hidden;} svg{display:block;}
</style></head><body>
<svg id="art" width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="inkBleed" x="-30%" y="-40%" width="160%" height="180%">
<feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="3" seed="5" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="28" xChannelSelector="R" yChannelSelector="G"/>
<feGaussianBlur stdDeviation="10"/></filter>
<filter id="ink1" x="-25%" y="-30%" width="150%" height="160%">
<feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="3" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
<feGaussianBlur stdDeviation="0.5"/></filter>
<filter id="ink2" x="-25%" y="-30%" width="150%" height="160%">
<feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="9" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
<feGaussianBlur stdDeviation="0.3"/></filter>
<filter id="inkSoft" x="-25%" y="-30%" width="150%" height="160%">
<feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="14" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
<feGaussianBlur stdDeviation="3.2"/></filter>
</defs>
<g id="river"></g><g id="nodes"></g>
</svg>
<script>
const NS='http://www.w3.org/2000/svg';
function sv(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
const RD="M -90 716 C 80 676, 150 330, 334 312 C 518 294, 556 706, 736 712 C 820 715, 862 600, 912 566";
const g=document.getElementById('river');
const c={d:RD,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'};
g.appendChild(sv('path',Object.assign({},c,{stroke:'#ABCEDB','stroke-width':'118','stroke-opacity':'.20',filter:'url(#inkBleed)',transform:'translate(0,7)'})));
g.appendChild(sv('path',Object.assign({},c,{stroke:'#C6DDE7','stroke-width':'72','stroke-opacity':'.44',filter:'url(#ink1)'})));
g.appendChild(sv('path',Object.assign({},c,{stroke:'#6F9FB6','stroke-width':'48','stroke-opacity':'.15',filter:'url(#inkSoft)',transform:'translate(0,9)'})));
const water=sv('path',Object.assign({},c,{stroke:'#8FBACE','stroke-width':'42','stroke-opacity':'.44',filter:'url(#ink2)'}));
g.appendChild(water);
g.appendChild(sv('path',Object.assign({},c,{stroke:'#4E7F97','stroke-width':'7','stroke-opacity':'.20',filter:'url(#inkSoft)',transform:'translate(0,4)'})));
const L=water.getTotalLength();
const FR=[0.170,0.239,0.308,0.377,0.446,0.515,0.584,0.653,0.722,0.791];
const ng=document.getElementById('nodes');
FR.forEach(function(f,i){
  const p=water.getPointAtLength(f*L);
  if(i===0){
    ng.appendChild(sv('circle',{cx:p.x,cy:p.y,r:26,fill:'none',stroke:'#B5432F','stroke-width':1,'stroke-opacity':'.38'}));
    ng.appendChild(sv('circle',{cx:p.x,cy:p.y,r:16,fill:'#B5432F'}));
  }else{
    ng.appendChild(sv('circle',{cx:p.x,cy:p.y,r:10.5,fill:'#F7F3E8',stroke:'#C0B8A4','stroke-width':1}));
    ng.appendChild(sv('circle',{cx:p.x,cy:p.y,r:3,fill:'#8FBACE'}));
  }
});
function label(txt,x,y,anchor){
  const t=sv('text',{x:x,y:y,'text-anchor':anchor,'font-size':12.5,'letter-spacing':'3',
    'fill':'#8C9794','font-family':'PingFang SC, sans-serif','paint-order':'stroke',
    stroke:'#F5F1E7','stroke-width':'4','stroke-linejoin':'round'});
  t.textContent=txt;ng.appendChild(t);
}
const p0=water.getPointAtLength(FR[0]*L);
const p9=water.getPointAtLength(FR[9]*L);
label('安河闸 · 起点', p0.x-10, p0.y+54, 'start');
label('温榆河口', Math.min(p9.x-6, 758), p9.y-40, 'end');
const cap=sv('text',{x:70,y:952,'font-size':10.5,'letter-spacing':'3','fill':'#AAB3AE',
  'font-family':'PingFang SC, sans-serif'});
cap.textContent='示意图 · 非实际比例';ng.appendChild(cap);
</script></body></html>
